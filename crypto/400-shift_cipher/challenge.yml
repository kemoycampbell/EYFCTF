name: "Shift Cipher"
author: "Kemoy Campbell"
category: Crytography

description: "The kidnappers decided that they will shift things up. They are now using real cipher instead of just changing the encode.... Can you shift and get the hidden message? Our security team has included the encrypted text for you to decoded as well as the encryption code that the kidnappers were using."

value: 400
type: standard

flags:
  - EYF{$hift_cipher_are_n0t_s3cure!}
# Optionals (Uncomment below)
files: 
  - encrypted.txt
  - shiftshift.py


tags:
  - cryptography
  - crypto

state: visible
version: "0.1"

hints:
    - {
        content: "The message looks scrambled, but the letters seem familiar. Could it be a simple substitution?
        Try shifting each letter backward in the alphabet. Start small—maybe 1, 2, or 3 letters.",
        cost: 10
    }
    - {
        content: "What happens if you shift 'p' back by 3 letters? What about 'b'?",
        cost: 20
    }
    - {
        content: "Online Caesar cipher decoders can help you test your theory.",
        cost: 30
    }
    - {
        content: "Use the terminal to run the Python script.",
        cost: 40
    }
    - {
        content: "After running the Python script, copy and paste the contents of encrypted.txt into the terminal.",
        cost: 50
    } 