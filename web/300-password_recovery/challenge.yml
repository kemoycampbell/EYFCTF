name: Password Recovery
author: Michael Berrios
category: Web
description: "Ritchie realized that both approaches to secure his password were not\
  \ secured at all, so he decided to store his password in the database. However,\
  \ a kidnapper extracted the encrypted password from the database which is e8d6bef289b86a7c0a964e94241b4aed.\
  \ Could you crack this password and successfully login to Ritchie\u2019s online\
  \ journal? We know that his username wasn't changed. Flag format EYF{Password}"
value: 300
type: standard
flags:
- EYF{orangetiger}
exposeService:
  protocol: http://
  internalPort: 80
  publicPort: 9092
  page: login.html
tags:
- web
state: visible
version: '0.1'
hints:
- content: The password is not encrypted.
  cost: 10
- content: The password is hashed with MD5 hashing algorithm.
  cost: 20
- content: Google on how to crack an MD5 hashed password.
  cost: 30
- content: Use Crackstation.net
  cost: 40
connection_info: http://localhost:9092/login.html
